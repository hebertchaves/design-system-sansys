<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design System Sansys - Exemplo de Uso</title>

  <!-- Material Icons: SERVIDA PELO DSS, não pelo Google.
       O @font-face vive em packages/core/tokens/semantic/accessibility/_font-face.scss
       e o arquivo em packages/core/assets/fonts/material-icons.woff2.
       O <link> para fonts.googleapis.com que estava aqui apontava para um
       endpoint SEM VERSÃO FIXADA — a renderização dos ícones podia mudar sem
       nenhum commit neste repositório. -->

  <!-- CSS do Quasar encapsulado via @layer quasar — DSS ganha precedência absoluta na cascata -->
  <link rel="stylesheet" href="/quasar-layered.css">

  <!-- CSS do Design System Sansys — importado via main.js (Vite compila direto do SCSS) -->

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
