# ==========================================================================
# Pipeline CI do Design System Sansys (DSS)
# ==========================================================================
# Gates que se tornaram REAIS nas Ondas P0–P2 (antes inexecutáveis):
#   - build da lib (tokens no dist)
#   - suíte unitária (2553 testes, projeto "unit")
#   - validação meta.json ↔ catálogo de tokens
#   - type-check (GATE bloqueante desde jun/2026 — baseline de 66 erros zerada)
#   - 14 gates estruturais/token/API (set/2026 — antes só no pre-commit local)
#
# Node 20 (engine usado no desenvolvimento). Cache de node_modules por lock.
# ==========================================================================

# --------------------------------------------------------------------------
# Quando criar pipeline (evita a duplicata "branch + MR"):
#   - MR aberto  → pipeline do MR (uma só)
#   - push na main → integração/base
#   - tag        → release
# Uma feature branch SEM MR não roda sozinha (roda ao abrir o MR, inclusive draft).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Regras aplicadas a CADA job. Sem isto, o default `only: [branches, tags]`
# excluiria os jobs da pipeline de MR — que sairia vazia. Referenciada via
# !reference em todos os jobs abaixo (job oculto, não executa por si só).
.dss-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - packages/core/node_modules/

stages:
  - install
  - build
  - test
  - quality

# --------------------------------------------------------------------------
install:
  stage: install
  rules:
    - !reference [.dss-rules, rules]
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
      - packages/core/node_modules/
    expire_in: 1 hour

# --------------------------------------------------------------------------
build:core:
  stage: build
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  script:
    - npm run core:build
  artifacts:
    paths:
      - packages/core/dist/
    expire_in: 1 day

build:portal:
  stage: build
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  script:
    - npm run docs:build

# --------------------------------------------------------------------------
test:unit:
  stage: test
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  script:
    - cd packages/core && npx vitest run --project unit
  # 2553 testes — gate bloqueante (CLAUDE.md: test.js é gate de build)

# --------------------------------------------------------------------------
validate:visual-contract:
  stage: quality
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  script:
    - npm run validate:css-meta

type-check:
  stage: quality
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  # GATE BLOQUEANTE desde jun/2026: a baseline de 66 erros pré-existentes foi
  # zerada (vue-tsc --noEmit = 0). allow_failure removido — regressão de tipo
  # passa a quebrar a pipeline. Correções type-only documentadas em
  # docs/governance/HANDOFF_TYPECHECK_BACKLOG.md.
  script:
    - cd packages/core && npm run type-check

# --------------------------------------------------------------------------
# GATES ESTRUTURAIS — subidos do pre-commit para o servidor (set/2026).
#
# POR QUE existe: estes 14 validadores rodavam APENAS no pre-commit, ou seja,
# na máquina de quem commita. Hook é opt-in por clone e ignorável com
# `--no-verify`, então na prática o CI cobria 6 checagens e as outras 14
# dependiam de disciplina individual. Num fluxo em que a revisão humana é leve,
# o servidor precisa ser o revisor — e não era.
#
# Não é hipótese: na própria onda que motivou este job, dois deslizes foram
# pegos por gates desta lista e por NENHUM dos que já estavam no CI —
# `dss-props` (prop chegando ao Quasar por $attrs, fora da API declarada) e
# `sandbox-tags` (`code` de Playground que não resolvia para um componente).
#
# Divididos em três jobs por NATUREZA do que verificam, para a pipeline dizer
# onde quebrou em vez de só "falhou". Rodam em paralelo (mesmo stage).
# --------------------------------------------------------------------------
quality:estrutura:
  stage: quality
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  # Forma do componente: 4 camadas, wrapper, barrel, orquestrador, import
  # canônico, sem estilo inline dimensional.
  script:
    - npm run validate:structure:gate
    - npm run validate:sfc-hygiene:gate
    - npm run validate:barrel-ext

quality:tokens:
  stage: quality
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  # Constituição #1 (token first) e a escala: todo var(--dss-*) existe, estado
  # não usa primitivo, hover vem de token, dimensão não empata nem inverte.
  script:
    - npm run validate:scss-tokens:gate
    - npm run validate:hover-tokens:gate
    - npm run validate:scale:gate
    - npm run validate:theme-scopes

quality:api:
  stage: quality
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  # A API declarada é a fonte de verdade: atributo usado existe no types,
  # a doc bate com o types, a grafia de variante espelha o Quasar, e o
  # sandbox/portal referencia componente que existe.
  script:
    - npm run validate:dss-props:gate
    - npm run validate:api-docs:gate
    - npm run validate:variant-naming:gate
    - npm run validate:field-conventions:gate
    - npm run validate:sandbox-tags
    - npm run validate:demo-registry
    - npm run validate:portal-pages

# --------------------------------------------------------------------------
contracts:gate:
  stage: quality
  needs: ["install"]
  rules:
    - !reference [.dss-rules, rules]
  # GATE do contrato derivado (dss.contract.json): re-emite todos os componentes
  # que JÁ têm contrato e valida contra o schema + verifica âncoras a11y (css via
  # token-math/CSS compilado, aria via prop, test via *.test.js). Bloqueia se um
  # contrato ficar inválido ou uma âncora a11y reprovar. Rollout incremental: um
  # componente entra no gate quando ganha seu dss.contract.json. Ver
  # docs/governance/DSS_BLUEPRINT_CADEIA_FONTE_UNICA.md (passo 2 + itens N/O).
  script:
    - npm run contracts:gate
